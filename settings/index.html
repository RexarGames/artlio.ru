<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Настройки — Dexxure Games</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="container topbar">
    <a class="brand" href="../">
      <span class="logo">DG</span>
      <span>Dexxure Games</span>
    </a>

    <button class="menu-btn" type="button" data-menu>Меню</button>

    <nav class="nav" data-nav>
      <a data-link href="../">Главная</a>
      <a data-link href="../games/">Игры</a>
      <a data-link href="../posts/">Посты</a>
      <a data-link href="../team/">Команда</a>
      <a data-link href="../workshop/">Мастерская</a>
      <a data-link href="../about/">О команде</a>
      <a data-link href="../settings/">Настройки</a>
    </nav>

    <div class="account">
      <span class="account-mail">karina.kurbatova.1991@ma...</span>
      <button class="pill-btn" type="button">Выйти</button>
    </div>
  </header>

  <main class="container main">
    <span class="kicker">Settings</span>
    <h1 class="page-title">Настройки</h1>


    <section class="section">
      <div class="section-head">
        <h2>Параметры</h2>
      </div>

      <div class="grid two">
        <div class="settings-row">
          <strong>Тема</strong>
          <select class="select" data-theme>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>

        <div class="settings-row">
          <strong>Язык</strong>
          <select class="select">
            <option>RU</option>
            <option>EN</option>
          </select>
        </div>
      </div>
    </section>


    <div class="warning">
      В сети могут появляться фейковые сайты и копии Dexxure Games. Проверяйте адрес, ссылки и не скачивайте файлы из подозрительных источников.
    </div>
  </main>

  <script src="../assets/app.js"></script>
</body>
</html>
