<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dexxure Games — настройки</title>
  <meta name="description" content="Настройки профиля Dexxure Games.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="settings">
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="home.html"><span class="brand-mark">DG</span><span>Dexxure Games</span></a>
      <button id="navToggle" class="menu-button" type="button">Меню</button>
      <nav class="nav" aria-label="Навигация">
        <a href="home.html">Главная</a><a href="games.html">Игры</a><a href="posts.html">Посты</a><a href="team.html">Команда</a><a href="workshop.html">Мастерская</a><a href="about.html">О команде</a><a href="settings.html">Настройки</a>
      </nav>
      <div class="account-line"><span id="userBadge">Profile</span><button id="logoutButton" type="button">Выйти</button></div>
    </header>
    <main>
      <section class="page-title">
        <p class="eyebrow">Profile</p>
        <h1>Настройки</h1>
        <p>Сохрани ник, акцентный цвет и режим отображения.</p>
      </section>

      <form id="settingsForm" class="form-card form-card--wide">
        <p id="settingsMessage" class="message-box" hidden></p>
        <label class="field"><span>Ник</span><input name="nickname" placeholder="DexxureUser"></label>
        <label class="field"><span>Акцентный цвет</span><input name="accent_color" type="color" value="#b7ff00"></label>
        <label class="check-field"><input name="scanlines" type="checkbox"><span>Лёгкая сетка на фоне</span></label>
        <label class="check-field"><input name="compact_mode" type="checkbox"><span>Компактный интерфейс</span></label>
        <label class="check-field"><input name="reduced_motion" type="checkbox"><span>Меньше анимаций</span></label>
        <button class="primary-button" type="submit">Сохранить</button>
      </form>
    </main>
    <footer class="site-footer">В сети могут появляться фейковые сайты и копии Dexxure Games. Проверяйте адрес, ссылки и не скачивайте файлы из подозрительных источников.</footer>
  </div>
  <script type="module" src="assets/app.min.js"></script>
</body>
</html>
