<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dexxure Games — регистрация</title>
  <meta name="description" content="Регистрация в портале Dexxure Games.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="register" class="auth-screen">
  <main class="auth-layout auth-layout--reverse">
    <section class="auth-copy">
      <a class="brand brand--large" href="../" aria-label="Dexxure Games">
        <span class="brand-mark">DG</span>
        <span>Dexxure Games</span>
      </a>
      <p class="eyebrow">Create profile</p>
      <h1>Создание аккаунта</h1>
      <p class="lead">Аккаунт нужен для сохранения настроек и отправки модов в мастерскую через ссылку на файл.</p>
    </section>

    <section class="auth-card" aria-label="Форма регистрации">
      <div class="auth-card__head">
        <h2>Регистрация</h2>
        <p>После создания аккаунта можно будет войти на сайт.</p>
      </div>

      <p id="authMessage" class="message-box" hidden></p>

      <form id="registerForm" class="form-stack">
        <label class="field">
          <span>Ник</span>
          <input name="nickname" type="text" autocomplete="nickname" required placeholder="DexxureUser">
        </label>
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </label>
        <label class="field">
          <span>Пароль</span>
          <input name="password" type="password" autocomplete="new-password" required placeholder="Минимум 6 символов">
        </label>
        <button class="primary-button" type="submit">Создать аккаунт</button>
      </form>

      <div class="auth-switch">
        <span>Уже есть аккаунт?</span>
        <a href="../">Войти</a>
      </div>
    </section>
  </main>
  <script type="module" src="../assets/app.min.js"></script>
</body>
</html>
